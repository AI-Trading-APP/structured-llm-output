[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structured-llm-output"
version = "0.2.0"
description = "Pydantic-bound provider-native structured output for LLM calls (Anthropic, OpenAI, Gemini)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI-Trading-APP", email = "kasi@ascendsoft.co" }]
dependencies = [
    "pydantic>=2.6,<3.0",
    "anthropic>=0.40,<1.0",
    "openai>=1.50,<2.0",
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0,<2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "opentelemetry-sdk>=1.25",
    "google-genai>=1.0,<2.0",
    "ruff",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/structured_llm_output"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/structured_llm_output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_llm: tests that hit real LLM APIs (excluded from default run)",
]
addopts = "-m 'not live_llm'"
