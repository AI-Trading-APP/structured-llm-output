name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/structured_llm_output
        continue-on-error: true   # MIN-1..MIN-5 carry-forwards may surface here; tighten in 0.2.x

      - name: Run tests with coverage
        env:
          # Provider SDKs validate API key presence at client construction;
          # tests stub the actual network calls.
          OPENAI_API_KEY: ci-fake-key-not-used
          ANTHROPIC_API_KEY: ci-fake-key-not-used
        run: pytest -v --cov=src/structured_llm_output --cov-report=term-missing --cov-fail-under=90
